name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    env:
      RLS_TEST_DATABASE_URL: postgresql://glasswork:glasswork@localhost:5432/glasswork_test
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: glasswork
          POSTGRES_PASSWORD: glasswork
          POSTGRES_DB: glasswork_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U glasswork -d glasswork_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    strategy:
      matrix:
        node-version: [20.x, 22.x, 24.x, 26.x]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint:ci

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Check types
        run: npm run typecheck

  consumer:
    name: Node 20 consumer / TypeScript ${{ matrix.typescript-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        typescript-version: [5.9.3, 6.0.3, 7.0.2]
    steps:
      - uses: actions/checkout@v4

      - name: Setup build runtime
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: 'npm'

      - name: Install and build
        run: npm ci && npm run build && npm run build:scripts

      - name: Setup consumer runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Test packed package and published types
        run: node .scripts/smoke-pack-consumer.js
        env:
          TYPESCRIPT_VERSION: ${{ matrix.typescript-version }}

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    env:
      RLS_TEST_DATABASE_URL: postgresql://glasswork:glasswork@localhost:5432/glasswork_test
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: glasswork
          POSTGRES_PASSWORD: glasswork
          POSTGRES_DB: glasswork_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U glasswork -d glasswork_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Generate coverage
        run: npm run test:coverage

      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        with:
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
