name: Release

on:
  push:
    branches: [main]
    paths: [package.json]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    name: Check version
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@v4

      - name: Compare package version with tags
        id: version
        run: |
          version=$(node -p 'require("./package.json").version')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null; then
            echo "v$version is already tagged, nothing to release."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  publish:
    name: Publish to npm
    needs: check
    if: needs.check.outputs.release == 'true'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC)
    env:
      RLS_TEST_DATABASE_URL: postgresql://glasswork:glasswork@localhost:5432/glasswork_test
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: glasswork
          POSTGRES_PASSWORD: glasswork
          POSTGRES_DB: glasswork_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U glasswork -d glasswork_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # prepublishOnly runs `npm run verify` before the package is uploaded
      - name: Publish
        run: |
          if npm view "glasswork@$VERSION" version > /dev/null 2>&1; then
            echo "glasswork@$VERSION is already on npm, skipping publish."
            exit 0
          fi
          dist_tag=latest
          case "$VERSION" in *-*) dist_tag=next ;; esac
          npm publish --tag "$dist_tag"
        env:
          VERSION: ${{ needs.check.outputs.version }}

  github-release:
    name: Create GitHub release
    needs: [check, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x

      # The changelog section is prepended to GitHub's generated pull request list
      - name: Create release
        run: |
          node scripts/changelog.ts notes "$VERSION" > "$RUNNER_TEMP/notes.md"
          prerelease=
          case "$VERSION" in *-*) prerelease=--prerelease ;; esac
          gh release create "v$VERSION" $prerelease \
            --target "$GITHUB_SHA" \
            --title "v$VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --generate-notes
        env:
          VERSION: ${{ needs.check.outputs.version }}
          GH_TOKEN: ${{ github.token }}
